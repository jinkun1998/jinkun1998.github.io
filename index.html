<!-- ponytail: static semantic markup; upgrade to dynamic API fetch when public repo count > 10 -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jinkun1998 | Apps</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --card-bg: #161922;
      --border: #2a2e3d;
      --text: #e6edf3;
      --subtext: #8b949e;
      --hover: #222734;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --card-bg: #f6f8fa;
        --border: #d0d7de;
        --text: #1f2328;
        --subtext: #656d76;
        --hover: #eaeef2;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 640px; margin: 0 auto; }
    header { margin-bottom: 28px; }
    h1 { font-size: 1.6rem; font-weight: 700; margin: 0 0 6px; }
    p.lead { margin: 0; color: var(--subtext); font-size: 0.95rem; }
    .grid { display: flex; flex-direction: column; gap: 12px; }
    .card {
      display: block;
      padding: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s, border-color 0.15s;
    }
    .card:hover {
      background: var(--hover);
      border-color: var(--subtext);
    }
    .card h2 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 600; }
    .card p { margin: 0; color: var(--subtext); font-size: 0.9rem; }
    .tag {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--border);
      color: var(--text);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>jinkun1998</h1>
      <p class="lead">Open-source applications & projects</p>
    </header>
    <div class="grid">
      <a class="card" href="https://jinkun1998.github.io/another.notch/">
        <h2>another.notch</h2>
        <p>macOS Dynamic Island utility for notch area controls, shortcuts, and widgets.</p>
        <span class="tag">macOS</span>
      </a>
      <a class="card" href="https://jinkun1998.github.io/another.MQTT/">
        <h2>another.MQTT</h2>
        <p>Cross-platform MQTT 5.0 desktop client with topic isolation and payload tools.</p>
        <span class="tag">Desktop</span>
      </a>
    </div>
  </main>
</body>
</html>
